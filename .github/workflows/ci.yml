name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Node 24 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate source of truth
        run: node scripts/validate.mjs

      - name: Test installers (OpenCode + standalone)
        run: node scripts/test-installer.mjs

      - name: Test multi-client build (plugin + standalone + OpenCode)
        run: node scripts/test-build.mjs

      - name: Check published plugin and catalogs
        run: node scripts/publish-default-plugin.mjs --check
