name: Cross-platform

# On-demand cross-platform coverage. Windows is the only platform with
# platform-specific code; macOS runs the same portable POSIX paths as
# Ubuntu. Run this from the Actions tab or `gh workflow run cross-platform.yml`
# when cross-platform coverage matters, for example after installer or build
# changes.
on: workflow_dispatch

permissions:
  contents: read

jobs:
  validate:
    name: Node 24 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate source of truth
        run: node scripts/validate.mjs

      - name: Test routing
        run: node scripts/test-routing.mjs

      - name: Test installers (OpenCode + standalone)
        run: node scripts/test-installer.mjs

      - name: Test multi-client build (plugin + standalone + OpenCode)
        run: node scripts/test-build.mjs

      - name: Check published plugin and catalogs
        run: node scripts/publish-default-plugin.mjs --check

      - name: Test plugin version enforcement
        run: node scripts/test-plugin-version.mjs

      - name: Test release safety
        run: node scripts/test-release-plugin.mjs
